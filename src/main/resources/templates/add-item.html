
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Inventory Item - Start 1 Spark</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- Website header -->
    <header>
        <h1>In-Kind Inventory Database</h1>
        <p>Inventory Management System</p>
    </header>

    <!-- Navigation links -->
    <nav>
        <a href="/">Home</a>
        <a href="/inventory">Inventory</a>
    </nav>

    <!-- Main content -->
    <main>
        <h2>Add Inventory Item</h2>

        <p>
            Enter the information for the new inventory item.
            Fields marked with * are required.
        </p>

        <!-- Displays any form errors -->
        <p class="form-error"
           th:if="${error}"
           th:text="${error}">
        </p>

        <!-- Sends inventory data to Java -->
        <form class="inventory-form"
              action="/inventory/add"
              method="post">

            <!-- Item Name -->
            <label for="name">Item Name *</label>
            <input type="text"
                   id="name"
                   name="name"
                   maxlength="150"
                   required>

            <!-- Quantity -->
            <label for="quantity"># of Items *</label>
            <input type="number"
                   id="quantity"
                   name="quantity"
                   min="0"
                   required>

            <!-- Size -->
            <label for="size">Size</label>
            <input type="text"
                   id="size"
                   name="size"
                   maxlength="50"
                   placeholder="Example: 4, Medium, Large">

            <!-- Gender - typeable field -->
            <label for="gender">Gender</label>
            <input type="text"
                   id="gender"
                   name="gender"
                   maxlength="50"
                   placeholder="Enter gender">

            <!-- Color -->
            <label for="color">Color</label>
            <input type="text"
                   id="color"
                   name="color"
                   maxlength="50"
                   placeholder="Example: Light Blue">

            <!-- Brand -->
            <label for="brand">Brand</label>
            <input type="text"
                   id="brand"
                   name="brand"
                   maxlength="100"
                   placeholder="Example: Adidas">

            <!-- Date Received -->
            <label for="dateReceived">Date Received</label>
            <input type="date"
                   id="dateReceived"
                   name="dateReceived">

            <!-- Donor -->
            <label for="donor">Donor</label>
            <input type="text"
                   id="donor"
                   name="donor"
                   maxlength="150"
                   placeholder="Enter donor name">

            <!-- Acknowledged - sponsor options -->
            <label for="acknowledged">Acknowledged</label>
            <select id="acknowledged" name="acknowledged">
                <option value="">Select Acknowledgment</option>
                <option value="Y">Y</option>
                <option value="N">N</option>
                <option value="n/a">n/a</option>
                <option value="Acknowledged">Acknowledged</option>
            </select>

            <!-- Status - sponsor options -->
            <label for="status">Status *</label>
            <select id="status" name="status" required>
                <option value="" disabled selected>
                    Select Status
                </option>
                <option value="Given to Partner">
                    Given to Partner
                </option>
                <option value="In Stock">In Stock</option>
                <option value="Discarded">Discarded</option>
                <option value="Status">Status</option>
                <option value="Partially Donated">
                    Partially Donated
                </option>
                <option value="Donated">Donated</option>
            </select>

            <!-- Estimated Value -->
            <label for="value">Value ($)</label>
            <input type="number"
                   id="value"
                   name="value"
                   min="0"
                   step="0.01"
                   placeholder="Example: 40.00">

            <!-- School -->
            <label for="school">School</label>
            <input type="text"
                   id="school"
                   name="school"
                   maxlength="150"
                   placeholder="Example: FCMS">

            <!-- Notes -->
            <label for="notes">Notes</label>
            <textarea id="notes"
                      name="notes"
                      rows="4"
                      placeholder="Enter additional information"></textarea>

            <!-- Save and Cancel buttons -->
            <div class="form-actions">
                <button type="submit">Save Item</button>
                <a class="button secondary-button"
                   href="/inventory">Cancel</a>
            </div>

        </form>
    </main>

</body>
</html>
